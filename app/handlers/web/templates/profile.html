<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IT Hub LXP - Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="app-body">
    <div class="screen-container">

        <div class="profile-header">
            <div class="user-info">
                <div class="avatar">
                    <img src="../static/example/profile-avatar.jpg" alt="Avatar" id="userAvatar">
                </div>
                <div class="user-details">
                    <h1 id="userName">Загрузка...</h1>
                    <span class="group-name" id="userGroup">[название группы]</span>
                </div>
            </div>
            <button class="icon-btn primary-circle">+</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">120 XP</div>
                <div class="stat-label">ОПЫТ ОБУЧЕНИЯ</div>
            </div>
            <div class="stat-card">
                <div class="stat-value accent">Level 4</div>
                <div class="stat-label">ТЕКУЩИЙ УРОВЕНЬ</div>
            </div>
        </div>

        <div class="section-header">
            <h2>Расписание сегодня</h2>
            <a href="#" class="section-link">Все предметы</a>
        </div>

        <div class="schedule-list">
            <!--Schedule-->
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="../templates/profile.html" class="nav-item active">
            <span class="nav-icon"><img src="../static/icons/profile.png"></span>
            <span>ПРОФИЛЬ</span>
        </a>
        <a href="../templates/schedule.html" class="nav-item">
            <span class="nav-icon"><img src="../static/icons/schedule.png"></span>
            <span>РАСПИСАНИЕ</span>
        </a>
        <a href="../templates/feedback.html" class="nav-item">
            <span class="nav-icon"><img src="../static/icons/feedback.png"></span>
            <span>ОТЗЫВЫ</span>
        </a>
    </nav>
</body>
</html>
